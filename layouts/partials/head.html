<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>
    {{- if .IsHome -}}
      {{ site.Title }}
    {{- else -}}
      {{ .Title }} — {{ site.Title }}
    {{- end -}}
  </title>
  {{- /* Favicon: the wizard icon, static/img/wizard.svg (+ optional wizard-dark.svg).
         Emitted only once the file exists, so nothing breaks before it arrives. */}}
  {{- if fileExists "static/img/wizard.svg" }}
  <link rel="icon" type="image/svg+xml" href="{{ "img/wizard.svg" | relURL }}"{{ if fileExists "static/img/wizard-dark.svg" }} media="(prefers-color-scheme: light)"{{ end }}>
  {{- if fileExists "static/img/wizard-dark.svg" }}
  <link rel="icon" type="image/svg+xml" href="{{ "img/wizard-dark.svg" | relURL }}" media="(prefers-color-scheme: dark)">
  {{- end }}
  {{- end }}
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    })"></script>
</head>
